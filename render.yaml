services:
  - type: web
    name: belife-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://belife.site
      - key: BREVO_SENDER_EMAIL
        value: noreply@belife.site
      - key: BREVO_SENDER_NAME
        value: BeLife
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: belife
      - key: R2_PUBLIC_URL
        value: https://pub-2ae409c286fc4911b15e6e38839790e9.r2.dev
